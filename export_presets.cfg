[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json, assets/sprites/*.json"
exclude_filter="test/*, addons/gut/*, docs/*, build/*, tools/*, art/*"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/background_color=Color(0.1843, 0.2275, 0.4196, 1)
progressive_web_app/icon_144x144="res://assets/app/icon_144.png"
progressive_web_app/icon_180x180="res://assets/app/icon_180.png"
progressive_web_app/icon_512x512="res://assets/app/icon_512.png"
